# All parameters and paths. Scripts read only from here.
# Values marked "start" are starting points to tune.

glofas:
  system_version: "version_5_0"   # copy the exact string from the EWDS download form
  start_year: 1980                # confirm v5 start (1979 or 1980)
  end_year: 2025                  # last full year of consolidated data
  area: [5.5, 33.5, -5.0, 42.5]   # N, W, S, E: Kenya plus a buffer

sites:
  min_upstream_area_km2: 1000     # start; also test 500
  area_growth_for_new_site: 0.4   # start; new site when upstream area grows by 40%
  max_sites: 80                   # small end-to-end run; null for the full run
  required_sites: 
  - [budalangi_nzoia, 34.02, 0.13]
  - [ahero_nyando, 34.92, -0.17]
  - [garissa_tana, 39.65, -0.45]
  - [hola_tana, 40.03, -1.50]
  - [garsen_tana, 40.12, -2.27]              # [name, lon, lat] for hotspots, e.g. lower Nzoia
  excluded_sites:                 # [name, lon, lat]; sites near these points are dropped
  - [omo_delta, 35.925, 4.475]    # flow almost all from Ethiopia, dam-regulated there
  excluded_radius_cells: 2

qc:
  zero_discharge_m3s: 0.01        # discharge below this counts as a zero day
  trend_p: 0.05                   # print sites whose annual-maximum trend has p below this
  max_zero_share: 0.5             # 04 uses only sites with daily zero_share at or below this

events:
  trigger_clusters_per_year: 1.0  # start; sets each site's trigger quantile
  merge_gap_days: 3               # start
  pad_days: 3                     # set from lag check, 2026-11-18
  split_above_days: 30            # start; longer windows are split at valleys if any exist, otherwise kept
  lag_check_pairs:                # [upstream_site_id, downstream_site_id], checked on the LDD
  - [28, 13]                      # Tana: Garissa -> Hola
  - [13, 3]                       # Tana: Hola -> Garsen
  - [47, 24]                      # Athi/Galana
  - [66, 63]                      # Nzoia -> Budalangi
  check_periods:                  # [label, first day, last day]; events overlapping these are printed
  - [OND_1997, 1997-10-01, 1997-12-31]
  - [MAM_1998, 1998-03-01, 1998-05-31]
  - [OND_2019, 2019-10-01, 2019-12-31]
  - [AM_2020, 2020-04-01, 2020-05-31]
  - [OND_2023, 2023-10-01, 2023-12-31]
  - [MAM_2024, 2024-03-01, 2024-05-31]
  check_sites: [24, 47]           # printed with the required sites for check_periods (Athi)

margins:
  threshold_quantile: 0.8         # texmex mqu (start)
  max_zero_share: 0.5             # drop sites with more zero event peaks than this
  range_quantiles: [0.5, 0.9]     # threshold range for gpdRangeFit diagnostics only; not used in the fit

dependence:
  threshold_quantile: 0.8         # texmex dqu (start); mexAll uses mex() defaults: Laplace margins, constrain = TRUE

simulation:
  n_years: 1000                   # 10000 for v1
  count_model: empirical          # resample historical annual event counts (Quinn et al. 2019)
  seed: 20261117
  mult: 2                         # mexMonteCarlo rejection multiple; 500-event test 2026-11-18: mult 1 had 0 NA rows, +1

output:
  rp_floor: 2                     # set to Fathom's lowest RP once confirmed

checks:
  marginal_T: [2, 5, 10, 50]      # check 1 figure
  ratio_T: [2, 10, 100]           # check 1 per-site ratio print, sorted by the second value
  cor_T: [2, 5]                   # check 2 co-occurrence
  cor_min: 0.05                   # check 2: CORE also over pairs with simulated COR above this
  extent_T: [2, 5, 10]            # checks 3 and 4
  big_years: [1997, 1998, 2019, 2020, 2023, 2024]  # check 4, calendar years
  profile_event: 2884             # check 6; simulated event_id, changes with simulation.seed

files:
  raw_discharge: data/raw/glofas_v5_{year}.nc
  upstream_area: data/raw/upArea_repaired_correctedmetadata_3000.nc         # manual download, GloFAS auxiliary data
  ldd: data/raw/ldd_repaired.nc                      # manual download, GloFAS auxiliary data
  calibration_outlets: data/raw/outlets_calibratedstations.nc
  lake_mask: data/raw/lakemask_Global_03min.nc
  regulated_sites: data/raw/20260306_reservoirs_glofas5_03min_longtermrun_thresholdscomputation.nc
  boundary: data/raw/geobounds_KEN.geojson
  rp_thresholds: null   # manual download, used in 07
  sites: data/interim/sites.parquet
  site_qc: data/interim/site_qc.parquet
  discharge: data/interim/discharge.parquet
  events: data/interim/events.parquet
  event_peaks: data/interim/event_peaks.parquet
  mex_fit: results/mex_fit.rds
  margins_params: results/margins_params.parquet
  dependence_params: results/dependence_params.parquet
  hist_probs: results/hist_probs.parquet
  sim_probs: results/sim_probs.parquet
  events_sim: results/events_sim.parquet
  event_rp: results/event_rp.parquet
  figures: figures
