# All parameters and paths. Scripts read only from here.
# Values marked "start" are starting points to tune.

glofas:
  system_version: "version_5_0"   # copy the exact string from the EWDS download form
  start_year: 1980                # confirm v5 start (1979 or 1980)
  end_year: 2025                  # last full year of consolidated data
  area: [5.5, 33.5, -5.0, 42.5]   # N, W, S, E: Kenya plus a buffer

sites:
  min_upstream_area_km2: 1000     # start; also test 500
  area_growth_for_new_site: 0.7   # new site when upstream area grows by 70%; 0.4 in r1-r4 (runs/full_tuning)
  confluence_min_share: 0.15      # confluence site only if the tributary has >= this share of the main stem's area (start)
  max_sites: null                 # full network; 80 for the small end-to-end runs r1-r4
  required_sites: 
  - [budalangi_nzoia, 34.02, 0.13]
  - [ahero_nyando, 34.92, -0.17]
  - [garissa_tana, 39.65, -0.45]
  - [hola_tana, 40.03, -1.50]
  - [garsen_tana, 40.12, -2.27]              # [name, lon, lat] for hotspots, e.g. lower Nzoia
  excluded_sites:                 # [name, lon, lat]; sites near these points are dropped
  - [omo_delta, 35.925, 4.475]    # flow almost all from Ethiopia, dam-regulated there
  # Ewaso Ng'iro (North) below the Lorian Swamp: transmission-loss reach where GloFAS flow does
  # not grow with upstream area; unreliable for flood statistics; low exposure. (v0 sites 7, 6, 4; a third point, 40.425, 0.175, has no site under confluence_min_share)
  - [ewaso_below_lorian_1, 40.275, 0.225]
  - [ewaso_below_lorian_3, 40.975, 0.475]
  # Amboseli: GloFAS routes Kilimanjaro outflow into the endorheic basin (outlet 29233) as perennial surface
  # flow (83 m3/s mean); the real swamps are mainly groundwater-fed. Artefact; low exposure. (full-network sites 58, 75)
  - [amboseli_sink, 37.175, -2.625]
  - [amboseli_inflow, 37.075, -2.675]
  excluded_radius_cells: 2

qc:
  zero_discharge_m3s: 0.01        # discharge below this counts as a zero day
  trend_p: 0.05                   # print sites whose annual-maximum trend has p below this
  max_zero_share: 0.4             # 04 uses only sites with daily zero_share at or below this; 0.5 in v0
  min_mean_flow_m3s: 2            # 04 also drops sites with mean daily flow below this; 5 drops perennial coastal basins

events:
  trigger_clusters_per_year: 0.5  # sets each site's trigger quantile; 1.0 in r1-r4 (runs/full_tuning)
  trigger_quantile_floor: 0.95    # trigger is at least this daily quantile (start)
  merge_gap_days: 3               # start
  pad_days: 3                     # set from lag check, 2026-11-18
  split_above_days: 30            # start; longer windows are split at valleys if any exist, otherwise kept
  # Check points: a required-site name, or [label, lon, lat] snapped to the nearest modelled site
  # (stop if further than check_snap_cells grid cells).
  check_snap_cells: 2
  lag_check_pairs:                # [upstream, downstream] check points
  - [garissa_tana, hola_tana]
  - [hola_tana, garsen_tana]
  - [[athi_upper, 37.975, -2.125], [galana_lower, 40.125, -3.175]]       # r4 ids 44, 21
  - [[nzoia_upstream, 34.825, 0.675], budalangi_nzoia]                   # next main-stem site; r4 id 63 (34.225, 0.175) is gone
  check_periods:                  # [label, first day, last day]; events overlapping these are printed
  - [OND_1997, 1997-10-01, 1997-12-31]
  - [MAM_1998, 1998-03-01, 1998-05-31]
  - [OND_2019, 2019-10-01, 2019-12-31]
  - [AM_2020, 2020-04-01, 2020-05-31]
  - [OND_2023, 2023-10-01, 2023-12-31]
  - [MAM_2024, 2024-03-01, 2024-05-31]
  check_sites:                    # check points printed with the required sites for check_periods
  - [galana_lower, 40.125, -3.175]   # r4 id 21
  - [athi_upper, 37.975, -2.125]     # r4 id 44

margins:
  threshold_quantile: 0.8         # texmex mqu (start)
  max_zero_share: 0.5             # drop sites with more zero event peaks than this
  range_quantiles: [0.5, 0.9]     # threshold range for gpdRangeFit diagnostics only; not used in the fit
  # Gaussian prior on the GPD (phi = log sigma, xi), centred on 0, as effective sds. texmex's penalty
  # has no 1/2, so 05 passes variance 2 * sd^2. v0 used the texmex default, variance (100^2, 0.25):
  # effective sds 70.7 and 0.354.
  phi_prior_sd: 100               # effectively flat
  xi_prior_sd: 0.2                # start

dependence:
  threshold_quantile: 0.8         # texmex dqu (start); mex() defaults otherwise: Laplace margins, constrain = TRUE

simulation:
  n_years: 10000                  # v1; 1000 for runs/full_1000
  count_model: empirical          # 06: resample historical years' event counts by class (Quinn et al. 2019)
  chunk_events: 200               # 05b: events per cluster chunk; the last chunk takes the remainder
  pool_factor: 1.3                # 05: pool = pool_factor x lambda x n_years events; r2 diagnostic needed 1.14
  class_rp: 5                     # 06: event class by number of sites at RP >= class_rp
  class_edges: [1, 5]             # 06: class lower edges; small 0, medium 1-4, large >= 5
  region_persistence: 0.8         # 06: chance a drawn event matches the historical event's region, not just its class; start
  regions:                        # 06: outlet_id (02's LDD cell index of the basin end) -> region; every modelled site's outlet
    # lake_victoria: rivers into Lake Victoria
    20160: lake_victoria          # Nzoia (Budalangi)
    21600: lake_victoria          # Nyando (Ahero)
    22320: lake_victoria          # outlet 33.525, -0.725; largest site 34.175, -0.925
    15480: lake_victoria          # outlet 33.525, 1.175; largest site 34.175, 0.575
    24660: lake_victoria          # Mara, via Tanzania
    # turkana_rift: Lake Turkana and endorheic Rift basins
    6170: turkana_rift            # Lake Turkana from the south-west
    10: turkana_rift              # north-west, outlet 34.025, 5.475 (dry)
    2585: turkana_rift            # north, outlet 36.775, 4.775 (dry)
    10163: turkana_rift           # Chalbi (dry)
    11761: turkana_rift           # Suguta valley, outlet 36.575, 2.225
    17691: turkana_rift           # Lake Baringo, outlet 36.075, 0.575
    22556: turkana_rift           # Lake Naivasha, outlet 36.325, -0.775
    28849: turkana_rift           # Ewaso Ng'iro South (Lake Natron)
    26515: turkana_rift           # south Rift, outlet 36.275, -1.875
    27774: turkana_rift           # south Rift, outlet 36.225, -2.225
    26698: turkana_rift           # pit at 36.425, -1.925, south of Nairobi
    # tana_ewaso: Tana, Ewaso Ng'iro (North) and the north-east
    29116: tana_ewaso             # Tana
    19799: tana_ewaso             # Ewaso Ng'iro (North), to the Lorian Swamp and Somalia
    5759: tana_ewaso              # Daua, to the Juba
    23569: tana_ewaso             # north-east, to Somalia, largest site 40.975, -0.775 (dry)
    # athi_coast: Athi/Galana and the coast
    31272: athi_coast             # Athi/Galana/Sabaki
    29233: athi_coast             # pit at 37.175, -2.625
    37712: athi_coast             # near Taveta, to Tanzania
    36474: athi_coast             # south coast, outlet 39.225, -4.625
    36297: athi_coast             # south coast, outlet 39.375, -4.575
    34503: athi_coast             # Mwache, Mombasa/Kwale
    32887: athi_coast             # coast, outlet 39.875, -3.625
    28045: athi_coast             # Lamu area, outlet 40.775, -2.275
    26967: athi_coast             # Lamu area, outlet 40.875, -1.975
    26969: athi_coast             # Lamu area, outlet 40.975, -1.975
    24286: athi_coast             # Lamu hinterland, to Somalia, outlet 41.825, -1.225
  seed: 20261117
  mult: 2                         # mexMonteCarlo rejection multiple; 500-event test 2026-11-18: mult 1 had 0 NA rows, +1

output:
  rp_floor: 2                     # set to Fathom's lowest RP once confirmed

checks:
  marginal_T: [2, 5, 10, 50]      # check 1 figure
  ratio_T: [2, 10, 100]           # check 1 per-site ratio print, sorted by the second value
  cor_T: [2, 5]                   # check 2 co-occurrence
  cor_min: 0.05                   # check 2: CORE also over pairs with simulated COR above this
  extent_T: [2, 5, 10]            # checks 3 and 4
  repeat_T: 2                     # check 7: site-years with RP >= repeat_T in two or more events
  big_years: [1997, 1998, 2019, 2020, 2023, 2024]  # check 4, calendar years

files:
  raw_discharge: data/raw/glofas_v5_{year}.nc
  upstream_area: data/raw/upArea_repaired_correctedmetadata_3000.nc         # manual download, GloFAS auxiliary data
  ldd: data/raw/ldd_repaired.nc                      # manual download, GloFAS auxiliary data
  calibration_outlets: data/raw/outlets_calibratedstations.nc
  lake_mask: data/raw/lakemask_Global_03min.nc
  regulated_sites: data/raw/20260306_reservoirs_glofas5_03min_longtermrun_thresholdscomputation.nc
  boundary: data/raw/geobounds_KEN.geojson
  rp_thresholds: null   # manual download, used in 07
  sites: data/interim/sites.parquet
  site_qc: data/interim/site_qc.parquet
  discharge: data/interim/discharge.parquet
  events: data/interim/events.parquet
  event_peaks: data/interim/event_peaks.parquet
  margins_params: results/margins_params.parquet
  dependence_params: results/dependence_params.parquet
  hist_probs: results/hist_probs.parquet
  sim_probs: results/sim_probs.parquet
  chunks: results/chunks_s{seed}_y{n_years}   # 05b writes chunk_NNNN.parquet here, 05c combines them; {seed}, {n_years} from simulation, so runs can't mix
  events_sim: results/events_sim.parquet
  event_rp: results/event_rp.parquet
  figures: figures
